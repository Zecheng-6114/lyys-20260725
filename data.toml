# ============================
# 游戏数据文件
# ============================

# --- UI 文本 ---
[messages]
game_title = "终端游戏引擎"
game_help_hint = "输入 help 查看可用命令"
prompt = ">"
goodbye = "再见！"
player_name = "冒险者"
currency_unit = "金币"
required_level_label = "需要等级"
capacity_unit = "格"

# --- 帮助文本 ---
[help]
title = "=== 命令帮助 ==="
lines = [
    "  help / h / ?          - 显示帮助",
    "  status / st           - 查看角色状态",
    "  inventory / inv / i   - 查看背包",
    "  equipment / eq        - 查看装备",
    "  search / find / s     - 搜索物品 (支持 type: rarity: 过滤)",
    "  inspect / ex <物品>   - 查看物品详情",
    "  equip <物品>          - 装备物品",
    "  unequip <槽位>        - 卸下装备",
    "  swapbackpack <背包>   - 替换背包",
    "  list / ls / l         - 查看商店",
    "  buy <物品> [数量]     - 购买物品",
    "  sell <物品> [数量]    - 出售物品",
    "  open <容器>           - 打开容器",
    "  close                 - 关闭容器",
    "  take <容器> <物品>    - 从容器取物",
    "  put <容器> <物品>     - 放入容器",
    "  contents <容器>       - 查看容器内容",
    "  talk <NPC名>          - 与NPC对话",
    "  npcs                  - 列出附近NPC",
    "  quit / q / exit       - 退出",
]

# --- 状态界面 ---
[status]
level_gold = "等级: {level}  金币: {gold}"
hp = "生命: {hp}/{max_hp}"
stats = "属性: {stats}"
backpack = "背包: {used}/{cap} 格已用"
no_backpack = "背包: 无"

# --- 背包界面 ---
[backpack_ui]
