# --- 对话定义 ---
[[dialogues]]
id = "dialogue_merchant"
npc_name = "王商人"

[[dialogues.nodes]]
id = "start"
text = "嘿，冒险者！有什么需要的吗？"

[[dialogues.nodes.choices]]
text = "最近有什么消息？"
next = "news"

[[dialogues.nodes.choices]]
text = "给我点路费吧"
next = "give_gold"
effects = [
    { effect_type = "give_gold", value = 20 },
]

[[dialogues.nodes.choices]]
text = "告辞"

[[dialogues.nodes]]
id = "news"
text = "听说北边的地牢里有不少好东西，不过也很危险。你小心点！"

[[dialogues.nodes.choices]]
text = "谢谢提醒"

[[dialogues.nodes]]
id = "give_gold"
text = "拿着，路上用！"

[[dialogues.nodes.choices]]
text = "多谢！"

[[dialogues]]
id = "dialogue_hunter"
npc_name = "老猎人"

[[dialogues.nodes]]
id = "start"
text = "年轻人，你也来打猎？我在这片森林混了三十年了。"

[[dialogues.nodes.choices]]
text = "能教我点什么吗？"
next = "teach"

[[dialogues.nodes.choices]]
text = "有什么好猎物推荐？"
next = "prey"

[[dialogues.nodes.choices]]
text = "打扰了"

[[dialogues.nodes]]
id = "teach"
text = "记住，活着才能带回猎物。别逞强。"

[[dialogues.nodes.choices]]
text = "受教了"

[[dialogues.nodes]]
id = "prey"
text = "东边有野猪，北边有狼群。新手别往深处走。送你一瓶药水。"

[[dialogues.nodes.choices]]
text = "谢谢老前辈"
effects = [
    { effect_type = "give_item", item_id = "health_potion", quantity = 1 },
]
